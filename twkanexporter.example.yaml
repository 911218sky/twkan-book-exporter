# 複製為 twkanexporter.yaml 後，可直接執行 npm run crawl。
# 命令列同名選項會覆寫這裡的設定。
book: "https://twkan.com/book/90206/index.html"
output: "output/90206"

# 3 個分頁與 1.5 秒等待是速度、記憶體使用量與網站穩定性的折衷。
concurrency: 3
delayMs: 1500
retries: 3

# 只抓前幾章，適合先確認輸出。
# limit: 10

# 排除單章或章節範圍；被排除的章節不下載、不使用快取、也不會合併。
# ignore: "1-2,8"
